<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel da Diretoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container fade-in">
        <aside class="sidebar slide-in-left">
            <div class="sidebar-title">Gestão Escolar</div>
            <nav class="menu-group">
                <button class="menu-item active slide-in-left delay-1" onclick="mostrarAba('professores', this)">👨‍🏫 Cadastrar Professor</button>
                <button class="menu-item slide-in-left delay-2" onclick="mostrarAba('turmas', this)">🏫 Cadastrar Turma</button>
                <button class="menu-item slide-in-left delay-3" onclick="mostrarAba('alunos', this)">👶 Cadastrar Aluno</button>
                <button class="menu-item slide-in-left delay-4" onclick="mostrarAba('controle', this)">📊 Controle Geral</button>
            </nav>
            <button class="menu-item" onclick="localStorage.clear(); window.location.href='/';" style="margin-top: auto; border: 1px solid #FF4444; color: #FF4444; justify-content: center;">Sair</button>
        </aside>

        <main class="main-content">
            <header class="top-bar slide-in-up">
                <div class="user-welcome" id="nome-diretor">Bem-vindo(a)</div>
                <button class="btn-theme" onclick="alternarTema()">Tema 🌓</button>
            </header>

            <section class="content-body">
                <div id="aba-professores" class="form-card pop-in delay-2">
                    <h2 style="margin-bottom: 2rem;">Novo Professor</h2>
                    <form onsubmit="cadastrarProfessor(event)">
                        <div class="input-group"><label>Nome Completo</label><input type="text" id="prof-nome" required></div>
                        <div class="input-group"><label>Acesso (Matrícula ou Usuário)</label><input type="text" id="prof-acesso" required></div>
                        <div class="input-group"><label>Senha Provisória</label><input type="password" id="prof-senha" required></div>
                        <button type="submit" class="btn-primary">Salvar Professor</button>
                    </form>
                </div>

                <div id="aba-turmas" class="form-card" style="display: none;">
                    <h2 style="margin-bottom: 2rem;">Nova Turma</h2>
                    <form onsubmit="cadastrarTurma(event)">
                        <div class="input-group"><label>Nome da Turma</label><input type="text" id="turma-nome" placeholder="Ex: 3º Ano Ensino Médio" required></div>
                        <button type="submit" class="btn-primary">Criar Turma</button>
                    </form>
                </div>

                <div id="aba-alunos" class="form-card" style="display: none;">
                    <h2 style="margin-bottom: 2rem;">Matricular Aluno</h2>
                    <form onsubmit="cadastrarAluno(event)">
                        <div class="input-group"><label>Nome Completo do Aluno</label><input type="text" id="aluno-nome" required></div>
                        <div class="input-group"><label>Vincular a uma Turma</label><select id="aluno-turma" required><option value="">Carregando...</option></select></div>
                        <button type="submit" class="btn-primary">Matricular Aluno</button>
                    </form>
                </div>

                <div id="aba-controle" style="display: none; max-width: 900px;">
                    <h2 style="margin-bottom: 1rem;">Professores Ativos</h2>
                    <div class="table-container" style="margin-bottom: 3rem;">
                        <table class="data-table">
                            <thead><tr><th>ID</th><th>Nome do Docente</th><th>Credencial de Acesso</th></tr></thead>
                            <tbody id="tabela-professores"></tbody>
                        </table>
                    </div>

                    <h2 style="margin-bottom: 1rem;">Alunos Matriculados</h2>
                    <div class="table-container">
                        <table class="data-table">
                            <thead><tr><th>ID</th><th>Nome do Aluno</th><th>Turma Corrente</th></tr></thead>
                            <tbody id="tabela-alunos"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('nome-diretor').innerText = 'Diretoria: ' + JSON.parse(localStorage.getItem('usuarioLogado')).nome;

        function mostrarAba(abaId, btn) {
            document.querySelectorAll('.form-card, #aba-controle').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            
            if(abaId === 'controle') {
                document.getElementById('aba-controle').style.display = 'block';
                carregarControleGeral();
            } else {
                const aba = document.getElementById(`aba-${abaId}`);
                aba.style.display = 'block';
                aba.classList.add('pop-in');
                if(abaId === 'alunos') carregarTurmasParaSelect();
            }
        }

        async function carregarControleGeral() {
            const resProf = await fetch('/api/professores');
            const profs = await resProf.json();
            document.getElementById('tabela-professores').innerHTML = profs.map(p => `<tr><td>#${p.id}</td><td><strong>${p.nome}</strong></td><td><code>${p.acesso}</code></td></tr>`).join('');

            const resAlunos = await fetch('/api/alunos/geral');
            const alunos = await resAlunos.json();
            document.getElementById('tabela-alunos').innerHTML = alunos.map(a => `<tr><td>#${a.id}</td><td><strong>${a.aluno_nome}</strong></td><td><span class="badge badge-success">${a.turma_nome || 'Não Alocado'}</span></td></tr>`).join('');
        }

        async function cadastrarProfessor(e) {
            e.preventDefault();
            const body = { nome: document.getElementById('prof-nome').value, acesso: document.getElementById('prof-acesso').value, senha: document.getElementById('prof-senha').value };
            const res = await fetch('/api/professores', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            if(res.ok) { alert('Professor registrado com sucesso!'); e.target.reset(); } else { const err = await res.json(); alert(err.error); }
        }

        async function cadastrarTurma(e) {
            e.preventDefault();
            await fetch('/api/turmas', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ nome: document.getElementById('turma-nome').value }) });
            alert('Turma criada com sucesso!'); e.target.reset();
        }

        async function carregarTurmasParaSelect() {
            const res = await fetch('/api/turmas');
            const turmas = await res.json();
            document.getElementById('aluno-turma').innerHTML = '<option value="">Selecione a Turma...</option>' + turmas.map(t => `<option value="${t.id}">${t.nome}</option>`).join('');
        }

        async function cadastrarAluno(e) {
            e.preventDefault();
            const body = { nome: document.getElementById('aluno-nome').value, turma_id: document.getElementById('aluno-turma').value };
            const res = await fetch('/api/alunos', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            
            if(res.ok) {
                alert('Aluno matriculado com sucesso!');
                e.target.reset();
            } else {
                const data = await res.json();
                alert(data.error); // Mensagem customizada de erro anti-duplicado
            }
        }
    </script>
</body>
</html>
